        console.log('  - resultsSection:', resultsSection ? '✓' : '✗ NULL!');
        console.log('  - tabBtns:', tabBtns.length, '개');

        // Critical null check
        if (!scriptForm) {
            console.error('❌ CRITICAL: scriptForm이 null입니다!');
            alert('오류: 폼을 찾을 수 없습니다. 페이지를 새로고침해주세요.');
            return;
        }

        // ========================================
        // CATEGORY SELECTION
        // ========================================

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => {
                    b.classList.remove('bg-purple-600');
                    b.classList.add('custom-input');
                });
                btn.classList.remove('custom-input');
                btn.classList.add('bg-purple-600');
                currentCategory = btn.dataset.category;
                console.log(`📌 카테고리 선택: ${currentCategory}`);
            });
        });

        // Set default category
        console.log('🏷️ 기본 카테고리 설정 중...');
        categoryBtns[0].click();

        // ========================================
        // FORM SUBMISSION
        // ========================================

        console.log('🎯 폼 이벤트 리스너 등록 시도...');

        scriptForm.addEventListener('submit', async (e) => {
            console.log('🚨🚨🚨 폼 제출 이벤트 발생! 🚨🚨🚨');
            e.preventDefault();
            e.stopPropagation();
            console.log('✅ preventDefault() 및 stopPropagation() 실행됨');

            try {
                // Get form data
                currentFormData = {
                    product: document.getElementById('product').value,
                    target: document.getElementById('target').value,
                    pain: document.getElementById('pain').value,
                    solution: document.getElementById('solution').value
                };

                console.log('📋 입력 데이터:', currentFormData);

                // Validate form data
                if (!currentFormData.product || !currentFormData.target ||
                    !currentFormData.pain || !currentFormData.solution) {
                    console.warn('⚠️ 필드 유효성 검사 실패');
                    alert('모든 필드를 입력해주세요!');
                    return;
                }

                console.log('✅ 유효성 검사 통과');

                // Show loading modal
                console.log('⏳ 로딩 모달 표시 시작...');
                showLoadingAnimation();

                // Wait 2.5 seconds
                console.log('⏰ 2.5초 대기 시작...');
                await new Promise(resolve => setTimeout(resolve, 2500));
                console.log('⏰ 2.5초 대기 완료');

                // Generate scripts for all tabs
                console.log('🎯 대본 생성 시작...');
                generateAllScripts();
                console.log('✨ 대본 생성 완료!');

                // Hide loading and show results
                console.log('🔄 화면 전환 시작...');
                loadingModal.classList.add('hidden');
                loadingModal.classList.remove('flex');
                inputSection.classList.add('hidden');
                resultsSection.classList.remove('hidden');
                console.log('✅ 화면 전환 완료');

                // Display current tab
                console.log('📊 결과 표시 시작...');
                displayScript(currentTab);
                console.log('🎉 모든 프로세스 완료!');

            } catch (error) {
                console.error('❌ 폼 처리 중 에러 발생:', error);
                console.error('에러 스택:', error.stack);
                alert('오류가 발생했습니다: ' + error.message);
            }
        });

        console.log('✅ 폼 이벤트 리스너 등록 완료');

        // TEST: Add click listener to submit button for debugging
        const submitButton = scriptForm.querySelector('button[type="submit"]');
        if (submitButton) {
            console.log('🔘 제출 버튼 발견:', submitButton);
            submitButton.addEventListener('click', (e) => {
                console.log('🖱️ 제출 버튼 클릭됨!');
            });
        } else {
            console.error('❌ 제출 버튼을 찾을 수 없습니다!');
        }

        // ========================================
        // LOADING ANIMATION
        // ========================================

        function showLoadingAnimation() {
            console.log('🔄 로딩 애니메이션 시작...');

            // Reset progress bar (프로그레스 바 초기화)
            progressBar.style.width = '0%';
            progressBar.classList.remove('progress-bar');

            // Force reflow to restart animation (애니메이션 재시작을 위한 reflow)
            void progressBar.offsetWidth;

            // Re-add animation class
            progressBar.classList.add('progress-bar');

            // Show modal
            loadingModal.classList.remove('hidden');
            loadingModal.classList.add('flex');

            const messages = [
                '업종별 톤앤매너 분석 중...',
                '후킹 키워드 조합 중...',
                '최적의 해시태그 매칭 중...'
            ];

            let currentMessageIndex = 0;
            loadingText.textContent = messages[0];

            const interval = setInterval(() => {
                currentMessageIndex++;
                if (currentMessageIndex < messages.length) {
                    loadingText.textContent = messages[currentMessageIndex];
                    console.log(`💬 ${messages[currentMessageIndex]}`);
                } else {
                    clearInterval(interval);
                }
            }, 800);
        }

        // ========================================
        // KOREAN JOSA AUTO-PROCESSING (조사 자동 처리)
        // ========================================

        // 받침 판별 함수
        function hasJongseong(word) {
            if (!word || word.length === 0) return false;
            const lastChar = word.charAt(word.length - 1);
            const code = lastChar.charCodeAt(0);

            // 한글 유니코드 범위 체크
            if (code < 0xAC00 || code > 0xD7A3) {
                // 한글이 아닌 경우 (숫자, 영어 등)
                return /[0-9]/.test(lastChar) ? false : true;
            }

            return (code - 0xAC00) % 28 !== 0;
        }

        // 조사 선택 함수
        function getJosa(word, josaType) {
            const hasFinalConsonant = hasJongseong(word);

            switch(josaType) {
                case '이/가': return hasFinalConsonant ? '이' : '가';
                case '을/를': return hasFinalConsonant ? '을' : '를';
                case '은/는': return hasFinalConsonant ? '은' : '는';
                case '과/와': return hasFinalConsonant ? '과' : '와';
                case '아/야': return hasFinalConsonant ? '아' : '야';
                case '이어/여': return hasFinalConsonant ? '이어' : '여';
                default: return '';
            }
        }

        // 스마트 변수 치환 함수
        function smartReplace(text, formData) {
            // 조사가 포함된 패턴 먼저 처리
            text = text.replace(/\{(product|target|pain|solution)\}\{([^}]+)\}/g, (match, variable, josa) => {
                const value = formData[variable];
                const selectedJosa = getJosa(value, josa);
                return value + selectedJosa;
            });

            // 일반 변수 치환
            text = text.replace(/{product}/g, formData.product);
            text = text.replace(/{target}/g, formData.target);
            text = text.replace(/{pain}/g, formData.pain);
            text = text.replace(/{solution}/g, formData.solution);

            return text;
        }

        // ========================================
        // SCRIPT GENERATION
        // ========================================

        function generateAllScripts() {
            const types = ['viral', 'logic', 'sales'];
            types.forEach(type => {
                currentScripts[type] = generateScript(type);
            });
        }

        function generateScript(type) {
            console.log(`🎨 ${type} 타입 대본 생성 중...`);

            const templates = TEMPLATES[currentCategory][type];

            // Random selection from templates
            const hook = templates.hooks[Math.floor(Math.random() * templates.hooks.length)];
            const body = templates.bodies[Math.floor(Math.random() * templates.bodies.length)];
            const closing = templates.closings[Math.floor(Math.random() * templates.closings.length)];

            // Smart replace with Korean josa processing
            let script = hook + body + closing;
            script = smartReplace(script, currentFormData);

            console.log(`✅ ${type} 대본 생성 완료 (${script.length}자)`);
            return script;
        }

        // ========================================
        // TAB SWITCHING
        // ========================================

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('tab-active');
                    b.classList.add('custom-input');
                });
                btn.classList.remove('custom-input');
                btn.classList.add('tab-active');

                currentTab = btn.dataset.tab;
                console.log(`🔄 탭 전환: ${currentTab}`);
                displayScript(currentTab);
            });
        });

        // ========================================
        // DISPLAY SCRIPT
        // ========================================

        function displayScript(type) {
            console.log(`📺 대본 표시: ${type} 타입`);

            const titles = {
                viral: '🔥 조회수 폭발형 대본',
                logic: '🧠 논리 설득형 대본',
                sales: '💰 당장 사세요형 대본'
            };

            resultTitle.textContent = titles[type];
            scriptContent.textContent = currentScripts[type];

            // Add fade-in animation
            scriptContent.classList.remove('fade-in');
            void scriptContent.offsetWidth; // Trigger reflow
            scriptContent.classList.add('fade-in');

            // Display hashtags
            displayHashtags();
            console.log(`✅ 대본 표시 완료`);
        }

        // ========================================
        // DISPLAY HASHTAGS
        // ========================================

        function displayHashtags() {
            console.log(`#️⃣ 해시태그 표시 중... (${currentCategory})`);
            const hashtags = HASHTAGS[currentCategory];
            hashtagsContainer.innerHTML = '';

            hashtags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'bg-purple-600/30 text-purple-300 px-3 py-1 rounded-full text-sm';
                span.textContent = tag;
                hashtagsContainer.appendChild(span);
            });
            console.log(`✅ 해시태그 ${hashtags.length}개 표시 완료`);
        }

        // ========================================
        // SHUFFLE BUTTON
        // ========================================

        shuffleBtn.addEventListener('click', () => {
            console.log('🔀 다시 섞기 시작...');
            currentScripts[currentTab] = generateScript(currentTab);
            displayScript(currentTab);
        });

        // ========================================
        // COPY BUTTON
        // ========================================

        copyBtn.addEventListener('click', async () => {
            console.log('📋 복사 버튼 클릭됨');

            const textToCopy = currentScripts[currentTab] + '\n\n' +
                               HASHTAGS[currentCategory].join(' ');

            console.log(`📝 복사할 텍스트 길이: ${textToCopy.length}자`);

            try {
                await navigator.clipboard.writeText(textToCopy);
                console.log('✅ 클립보드에 복사 성공!');

                // Confetti effect
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                console.log('🎉 폭죽 효과 실행!');

                // Button feedback
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check mr-2"></i>복사완료!✨';
                copyBtn.classList.add('bg-green-600');

                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.classList.remove('bg-green-600');
                    console.log('🔄 복사 버튼 원래 상태로 복구');
                }, 2000);

            } catch (err) {
                console.error('❌ 복사 실패:', err);
                alert('복사에 실패했습니다. 다시 시도해주세요.');
            }
        });

        console.log('✅ 모든 이벤트 리스너 등록 완료!');

        }); // DOMContentLoaded 종료

    </script>
