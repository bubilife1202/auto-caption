                    loadingText.textContent = messages[currentMessageIndex];

            // Replace placeholders
            let script = hook + body + closing;
            script = script.replace(/{product}/g, currentFormData.product);
            script = script.replace(/{target}/g, currentFormData.target);
            script = script.replace(/{pain}/g, currentFormData.pain);
            script = script.replace(/{solution}/g, currentFormData.solution);

            console.log(`✅ ${type} 대본 생성 완료 (${script.length}자)`);
