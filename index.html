    <div id="historyModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-dark-800 border border-white/10 rounded-3xl shadow-2xl max-w-2xl w-full mx-4 flex flex-col max-h-[80vh]">

                <div class="text-center text-gray-500 py-8">

            </div>

        </div>

    <!-- Load Data -->

    <!-- Main App Logic -->
    <script src="js/app.js"></script>

    <style>
        @keyframes loading-bar {
            0% { width: 0%; left: 0; }
            50% { width: 70%; left: 30%; }
            100% { width: 0%; left: 100%; }
        }
        .animate-loading-bar {
            animation: loading-bar 2s infinite linear;
        }
    </style>
